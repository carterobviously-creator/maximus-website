<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Logic Elite | V4 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { 
            background: #020203; 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .forge-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 1rem;
        }

        .action-button {
            background: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-button:hover:not(:disabled) {
            background: #6366f1;
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .preview-container {
            flex: 1;
            margin: 12px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        #loadingOverlay {
            background: #020203;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .progress-bar {
            width: 250px;
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            background: #6366f1;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="fixed inset-0">
        <div class="loader-ring"></div>
        <p id="statusLabel" class="text-[10px] text-white/40 uppercase tracking-widest mt-6">Initializing Forge Engine...</p>
        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>
    </div>

    <header class="px-6 pt-6 flex justify-between items-center">
        <span class="font-black text-sm tracking-tighter">FORGE ELITE V4</span>
        <div id="genMsg" class="text-[9px] text-white/20 uppercase tracking-widest font-bold">Local AI Ready</div>
    </header>

    <main class="flex-1 flex flex-col min-h-0">
        <div class="preview-container">
            <div id="emptyState" class="absolute inset-0 flex items-center justify-center bg-[#020203]">
                <p class="text-white/10 text-[10px] font-mono tracking-[0.4em] uppercase">Neural Workspace Empty</p>
            </div>
            <iframe id="preview" class="hidden"></iframe>
        </div>
    </main>

    <footer class="p-6 pb-8">
        <div class="max-w-4xl mx-auto glass-panel p-2 rounded-2xl flex items-center gap-4">
            <div class="pl-4 flex-1">
                <input type="text" id="promptInput" class="forge-input" placeholder="Enter site vision..." disabled>
            </div>
            <button onclick="handleForge()" id="forgeBtn" disabled class="action-button px-8 py-4 rounded-xl">Build</button>
        </div>
    </footer>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let generator = null;
        const elements = {
            loading: document.getElementById('loadingOverlay'),
            progress: document.getElementById('progressFill'),
            status: document.getElementById('statusLabel'),
            input: document.getElementById('promptInput'),
            btn: document.getElementById('forgeBtn'),
            msg: document.getElementById('genMsg'),
            preview: document.getElementById('preview'),
            empty: document.getElementById('emptyState')
        };

        async function init() {
            try {
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            elements.progress.style.width = `${p.progress}%`;
                            elements.status.innerText = `Caching AI Core: ${Math.round(p.progress)}%`;
                        }
                    }
                });
                elements.loading.style.display = 'none';
                elements.input.disabled = false;
                elements.btn.disabled = false;
            } catch (e) {
                elements.status.innerText = "Error Loading AI Engine.";
                console.error(e);
            }
        }

        window.handleForge = async () => {
            const prompt = elements.input.value.trim();
            if (!prompt || !generator) return;

            elements.btn.disabled = true;
            elements.msg.innerText = "Forging... (Brief lag expected)";

            const template = `<|im_start|>system\nYou are a master developer. Create a clean HTML website with Tailwind CSS. Return ONLY raw HTML code. Do not use markdown blocks.<|im_end|>\n<|im_start|>user\nBuild: ${prompt}<|im_end|>\n<|im_start|>assistant`;

            try {
                setTimeout(async () => {
                    const result = await generator(template, {
                        max_new_tokens: 1200,
                        temperature: 0.1,
                        do_sample: false
                    });

                    let code = result[0].generated_text.split('<|im_start|>assistant')[1] || result[0].generated_text;
                    code = code.replace(/```html|```/gi, '').trim();

                    elements.preview.srcdoc = code;
                    elements.preview.classList.remove('hidden');
                    elements.empty.classList.add('hidden');
                    elements.msg.innerText = "Forge complete.";
                    elements.btn.disabled = false;
                }, 100);
            } catch (err) {
                elements.msg.innerText = "Forge failed.";
                elements.btn.disabled = false;
            }
        };

        init();
    </script>
</body>
</html>
