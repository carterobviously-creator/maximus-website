<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Elite | AI Website Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#09090b',
                            925: '#0d0d10'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: #09090b;
            color: #fafafa;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }

        /* ── Loading overlay ── */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loadingOverlay.hidden-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-wordmark {
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.18);
            margin-bottom: 28px;
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.06);
            border-top-color: #818cf8;
            animation: spin 0.9s linear infinite;
        }

        .loader-status {
            margin-top: 20px;
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
        }

        .loader-track {
            width: 220px;
            height: 2px;
            background: rgba(255,255,255,0.06);
            border-radius: 9999px;
            margin-top: 14px;
            overflow: hidden;
        }
        .loader-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            width: 0%;
            transition: width 0.25s ease;
            border-radius: 9999px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── App shell ── */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top command bar ── */
        #commandBar {
            flex-shrink: 0;
            padding: 14px 20px 0;
            z-index: 100;
        }

        .bar-inner {
            max-width: 860px;
            margin: 0 auto;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 6px 6px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.4),
                0 8px 32px rgba(0,0,0,0.5),
                0 0 80px rgba(99, 102, 241, 0.04);
            transition: box-shadow 0.3s ease;
        }
        .bar-inner:focus-within {
            border-color: rgba(129, 140, 248, 0.3);
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.4),
                0 8px 32px rgba(0,0,0,0.5),
                0 0 0 3px rgba(99, 102, 241, 0.12),
                0 0 80px rgba(99, 102, 241, 0.08);
        }

        .bar-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(129, 140, 248, 0.6);
        }
        .bar-icon svg { width: 15px; height: 15px; }

        .bar-divider {
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.07);
            flex-shrink: 0;
        }

        #promptInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fafafa;
            font-size: 0.875rem;
            font-family: inherit;
            font-weight: 400;
            line-height: 1.5;
            caret-color: #818cf8;
            min-width: 0;
        }
        #promptInput::placeholder { color: rgba(255,255,255,0.22); }
        #promptInput:disabled { cursor: not-allowed; }

        .bar-meta {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #statusPill {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(129, 140, 248, 0.1);
            color: rgba(129, 140, 248, 0.7);
            border: 1px solid rgba(129, 140, 248, 0.15);
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        #statusPill.forging {
            background: rgba(251, 191, 36, 0.1);
            color: rgba(251, 191, 36, 0.8);
            border-color: rgba(251, 191, 36, 0.2);
            animation: pulse-pill 1.4s ease-in-out infinite;
        }
        #statusPill.done {
            background: rgba(52, 211, 153, 0.1);
            color: rgba(52, 211, 153, 0.8);
            border-color: rgba(52, 211, 153, 0.2);
        }
        #statusPill.error {
            background: rgba(248, 113, 113, 0.1);
            color: rgba(248, 113, 113, 0.8);
            border-color: rgba(248, 113, 113, 0.2);
        }

        @keyframes pulse-pill {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #forgeBtn {
            flex-shrink: 0;
            background: #ffffff;
            color: #09090b;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 10px 22px;
            border-radius: 11px;
            transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
            white-space: nowrap;
        }
        #forgeBtn:hover:not(:disabled) {
            background: #6366f1;
            color: #fff;
            box-shadow: 0 0 24px rgba(99, 102, 241, 0.45), 0 4px 12px rgba(0,0,0,0.4);
        }
        #forgeBtn:active:not(:disabled) {
            transform: scale(0.97);
        }
        #forgeBtn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ── Preview area ── */
        #previewWrap {
            flex: 1;
            min-height: 0;
            padding: 12px 20px 16px;
            display: flex;
            flex-direction: column;
        }

        .preview-shell {
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #000;
            position: relative;
            box-shadow: 0 4px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.5);
        }

        /* Window chrome dots */
        .chrome-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: rgba(18, 18, 20, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 7px;
            z-index: 10;
        }
        .chrome-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .chrome-dot.red   { background: #ff5f57; }
        .chrome-dot.amber { background: #febc2e; }
        .chrome-dot.green { background: #28c840; }

        .chrome-url {
            flex: 1;
            margin: 0 12px;
            height: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chrome-url span {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.06em;
        }

        #emptyState {
            position: absolute;
            inset: 36px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #09090b;
        }

        .empty-glyph {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(129, 140, 248, 0.4);
        }
        .empty-glyph svg { width: 24px; height: 24px; }

        .empty-label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.12);
        }

        #preview {
            position: absolute;
            inset: 36px 0 0;
            width: 100%;
            height: calc(100% - 36px);
            border: none;
            background: white;
            display: none;
        }

        /* ── Footer wordmark ── */
        #footer {
            flex-shrink: 0;
            text-align: center;
            padding-bottom: 10px;
        }
        #footer span {
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-wordmark">Forge Elite</div>
        <div class="loader-ring"></div>
        <div id="loaderStatus" class="loader-status">Initializing AI Engine&hellip;</div>
        <div class="loader-track">
            <div id="loaderFill" class="loader-fill"></div>
        </div>
    </div>

    <!-- App Shell -->
    <div id="app">

        <!-- Top Command Bar -->
        <div id="commandBar">
            <div class="bar-inner">
                <div class="bar-icon">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2L9.5 6.5L14 8L9.5 9.5L8 14L6.5 9.5L2 8L6.5 6.5Z"/>
                    </svg>
                </div>
                <div class="bar-divider"></div>
                <input
                    type="text"
                    id="promptInput"
                    placeholder="Describe the website you want to build&hellip;"
                    disabled
                    autocomplete="off"
                    spellcheck="false"
                />
                <div class="bar-meta">
                    <div id="statusPill">Ready</div>
                    <button id="forgeBtn" disabled onclick="handleForge()">Forge</button>
                </div>
            </div>
        </div>

        <!-- Live Preview -->
        <div id="previewWrap">
            <div class="preview-shell">
                <!-- Fake browser chrome -->
                <div class="chrome-bar">
                    <div class="chrome-dot red"></div>
                    <div class="chrome-dot amber"></div>
                    <div class="chrome-dot green"></div>
                    <div class="chrome-url">
                        <span id="chromeUrl">forge://workspace</span>
                    </div>
                </div>

                <!-- Empty state -->
                <div id="emptyState">
                    <div class="empty-glyph">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="3"/>
                            <path d="M3 9h18M9 21V9"/>
                        </svg>
                    </div>
                    <div class="empty-label">Neural Workspace Empty</div>
                </div>

                <!-- Preview iframe -->
                <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>

        <!-- Footer wordmark -->
        <div id="footer"><span>Forge Elite &middot; In-Browser AI</span></div>

    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let generator = null;

        const el = {
            overlay:    document.getElementById('loadingOverlay'),
            loaderFill: document.getElementById('loaderFill'),
            loaderStatus: document.getElementById('loaderStatus'),
            input:      document.getElementById('promptInput'),
            btn:        document.getElementById('forgeBtn'),
            pill:       document.getElementById('statusPill'),
            preview:    document.getElementById('preview'),
            empty:      document.getElementById('emptyState'),
            chromeUrl:  document.getElementById('chromeUrl'),
        };

        // Allow Enter key to trigger forge
        el.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !el.btn.disabled) handleForge();
        });

        function setStatus(text, state = '') {
            el.pill.textContent = text;
            el.pill.className = state || '';
        }

        async function init() {
            try {
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            const pct = Math.round(p.progress);
                            el.loaderFill.style.width = `${pct}%`;
                            el.loaderStatus.textContent = `Caching AI Core — ${pct}%`;
                        }
                        if (p.status === 'done') {
                            el.loaderStatus.textContent = 'Engine ready.';
                        }
                    }
                });
                el.overlay.classList.add('hidden-out');
                el.input.disabled = false;
                el.btn.disabled = false;
                el.input.focus();
                setStatus('Ready');
            } catch (e) {
                el.loaderStatus.textContent = 'Failed to load AI engine.';
                console.error(e);
            }
        }

        const MAX_URL_SLUG_LEN = 38;

        window.handleForge = async () => {
            const prompt = el.input.value.trim();
            if (!prompt || !generator) return;

            el.btn.disabled = true;
            el.input.disabled = true;
            setStatus('Forging…', 'forging');
            el.chromeUrl.textContent = 'forge://generating…';

            const messages = [
                {
                    role: 'system',
                    content: 'You are an expert front-end developer. When given a description, produce a complete, single-file HTML page using Tailwind CSS (via CDN). Return ONLY the raw HTML — no markdown fences, no commentary.'
                },
                {
                    role: 'user',
                    content: `Build: ${prompt}`
                }
            ];

            const template =
                `<|im_start|>system\n${messages[0].content}<|im_end|>\n` +
                `<|im_start|>user\n${messages[1].content}<|im_end|>\n` +
                `<|im_start|>assistant`;

            try {
                const result = await generator(template, {
                    max_new_tokens: 1400,
                    temperature: 0.15,
                    repetition_penalty: 1.1,
                    do_sample: false
                });

                let code = result[0].generated_text;
                const assistantIdx = code.lastIndexOf('<|im_start|>assistant');
                if (assistantIdx !== -1) code = code.slice(assistantIdx + '<|im_start|>assistant'.length);
                // Strip everything from the end-of-message marker onward, then clean markdown fences
                code = code.replace(/<\|im_end\|>[\s\S]*/g, '').replace(/```html|```/gi, '').trim();

                el.preview.srcdoc = code;
                el.preview.style.display = 'block';
                el.empty.style.display = 'none';
                el.chromeUrl.textContent = `forge://${prompt.slice(0, MAX_URL_SLUG_LEN).toLowerCase().replace(/\s+/g, '-')}`;
                setStatus('Done', 'done');
            } catch (err) {
                console.error(err);
                setStatus('Error', 'error');
                el.chromeUrl.textContent = 'forge://workspace';
            } finally {
                el.btn.disabled = false;
                el.input.disabled = false;
                el.input.focus();
            }
        };

        init();
    </script>
</body>
</html>
