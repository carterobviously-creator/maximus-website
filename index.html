<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Website Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .glow:focus {
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    <!-- Command bar -->
    <div class="fixed top-0 left-0 right-0 z-10 bg-zinc-900 p-4 shadow-lg">
        <div class="flex items-center justify-center space-x-4">
            <input type="text" id="prompt" class="flex-1 px-4 py-2 bg-zinc-800 text-white rounded-lg border border-zinc-700 focus:outline-none glow" placeholder="Describe your website...">
            <button id="forge" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Forge</button>
            <button id="settings" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg">Settings</button>
        </div>
    </div>
    <!-- Preview area -->
    <iframe id="preview" class="w-full h-screen mt-16"></iframe>
    <!-- Settings modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-20">
        <div class="bg-zinc-800 p-6 rounded-lg">
            <h2 class="text-lg mb-4">Settings</h2>
            <label for="api-key" class="block mb-2">OpenRouter API Key:</label>
            <input type="password" id="api-key" class="w-full px-3 py-2 bg-zinc-700 text-white rounded" placeholder="Enter your API key">
            <div class="flex justify-end space-x-2 mt-4">
                <button id="save-settings" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded">Save</button>
                <button id="cancel-settings" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        const promptInput = document.getElementById('prompt');
        const forgeBtn = document.getElementById('forge');
        const settingsBtn = document.getElementById('settings');
        const preview = document.getElementById('preview');
        const modal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key');
        const saveSettingsBtn = document.getElementById('save-settings');
        const cancelSettingsBtn = document.getElementById('cancel-settings');

        // Load API key
        let apiKey = localStorage.getItem('openrouter-api-key');
        if (apiKey) {
            apiKeyInput.value = apiKey;
        }

        // Show modal
        function showModal() {
            modal.classList.remove('hidden');
        }

        // Hide modal
        function hideModal() {
            modal.classList.add('hidden');
        }

        settingsBtn.addEventListener('click', showModal);
        cancelSettingsBtn.addEventListener('click', hideModal);
        saveSettingsBtn.addEventListener('click', () => {
            apiKey = apiKeyInput.value;
            localStorage.setItem('openrouter-api-key', apiKey);
            hideModal();
        });

        // Forge function
        forgeBtn.addEventListener('click', async () => {
            if (!apiKey) {
                showModal();
                return;
            }
            const userPrompt = promptInput.value;
            if (!userPrompt.trim()) return;

            forgeBtn.disabled = true;
            forgeBtn.textContent = 'Forging...';
            forgeBtn.classList.add('shimmer');

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'minimax/minimax-01',
                        messages: [
                            { role: 'user', content: `Generate the complete HTML code for a website based on this description: ${userPrompt}. Output only the HTML code, no markdown code blocks or explanations.` }
                        ],
                    }),
                });

                const data = await response.json();
                let html = data.choices[0].message.content;

                // Clean: strip ```html and ```
                html = html.replace(/```html\s*/g, '').replace(/```\s*$/g, '');

                // Inject into iframe
                const blob = new Blob([html], { type: 'text/html' });
                preview.src = URL.createObjectURL(blob);

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to generate website. Check your API key and try again.');
            } finally {
                forgeBtn.disabled = false;
                forgeBtn.textContent = 'Forge';
                forgeBtn.classList.remove('shimmer');
            }
        });
    </script>
</body>
</html>
