<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge - AI Logic Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        body { 
            background: #05060b; 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .neo-sidebar {
            background: rgba(13, 15, 23, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            width: 440px;
        }

        .prompt-container {
            background: #0d0f17;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .prompt-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-forge {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-forge:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
            filter: brightness(1.1);
        }

        .preview-area {
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 32px 32px;
        }

        .device-frame {
            width: 100%;
            max-width: 960px;
            height: 85%;
            background: #fff;
            border-radius: 24px;
            border: 12px solid #1e2230;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .loader-ring {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tag {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="flex">

    <aside class="neo-sidebar flex flex-col p-8 shrink-0 relative z-10">
        <div class="flex items-center gap-4 mb-10">
            <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center shadow-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white leading-none">FORGE <span class="text-indigo-400">LOGIC</span></h1>
                <p class="text-slate-500 text-xs font-medium mt-1 uppercase tracking-widest">Advanced Application Engine</p>
            </div>
        </div>

        <div class="flex-1 space-y-8">
            <section>
                <div class="flex items-center justify-between mb-3">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Functionality Prompt</label>
                    <span class="tag">Active Logic</span>
                </div>
                <div class="prompt-container rounded-2xl p-5 transition-all">
                    <textarea id="prompt" placeholder="Describe the behavior. e.g., 'Build a task manager where I can add, delete, and mark items complete with local storage saving...'" 
                        class="w-full h-72 bg-transparent text-slate-200 text-base leading-relaxed outline-none resize-none placeholder:text-slate-600 font-medium"></textarea>
                </div>
            </section>

            <button onclick="forgeApp()" id="forgeBtn" class="btn-forge w-full py-5 rounded-2xl font-extrabold text-white text-lg flex items-center justify-center gap-4 group disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="btnText">Manifest Reality</span>
                <div id="loader" class="loader-ring hidden"></div>
                <svg id="arrow" class="w-6 h-6 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>

        <div class="mt-auto pt-8 border-t border-white/5 space-y-4">
            <div class="flex gap-2">
                <button onclick="exportCode()" class="flex-1 py-3 rounded-xl bg-slate-800/50 hover:bg-slate-700/50 text-slate-300 text-sm font-bold border border-white/5 transition-all">Export Code</button>
                <button onclick="clearCanvas()" class="px-4 py-3 rounded-xl bg-slate-800/50 hover:bg-red-900/20 text-slate-400 text-sm border border-white/5 transition-all">
                    Reset
                </button>
            </div>
            <p class="text-[10px] text-zinc-500 text-center font-medium">
                Logic Injection Enabled &bull; Full DOM Access
            </p>
        </div>
    </aside>

    <main class="preview-area flex-1 flex flex-col items-center justify-center p-12 relative">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-center px-10 pointer-events-none transition-opacity duration-500">
            <h2 class="text-3xl font-bold text-slate-700 mb-2">Awaiting Intelligence</h2>
            <p class="text-slate-500 max-w-sm">I will generate the HTML, the CSS, and the working JavaScript logic to make your idea come alive.</p>
        </div>

        <div class="device-frame opacity-0 transition-all duration-700 scale-95" id="frameWrapper">
            <iframe id="mainCanvas" class="w-full h-full border-none"></iframe>
        </div>
    </main>

    <script>
        const apiKey = ""; 

        function clearCanvas() {
            document.getElementById('prompt').value = "";
            document.getElementById('mainCanvas').srcdoc = "";
            document.getElementById('frameWrapper').classList.add('opacity-0', 'scale-95');
            document.getElementById('emptyState').classList.remove('opacity-0');
        }

        function exportCode() {
            const frame = document.getElementById('mainCanvas');
            const code = frame.getAttribute('data-full-code') || frame.srcdoc;
            
            if(!code) return;

            // Create a blob for a real file download instead of just clipboard
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'forge-app.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // Still copy to clipboard as a backup
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        async function forgeApp() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return;

            const btn = document.getElementById('forgeBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const arrow = document.getElementById('arrow');
            const frame = document.getElementById('mainCanvas');
            const wrapper = document.getElementById('frameWrapper');
            const empty = document.getElementById('emptyState');

            btn.disabled = true;
            btnText.innerText = "Processing Logic...";
            loader.classList.remove('hidden');
            arrow.classList.add('hidden');
            
            const systemPrompt = `
                You are a full-stack engineer. Build a COMPLETELY FUNCTIONAL web application in a single HTML file.
                CRITICAL: The user wants LOGIC. 
                - Include a <script> tag with real, working JavaScript.
                - Implement state management, event listeners, and data handling.
                - Use Tailwind CSS for a modern, high-end design.
                - Make it "Smart": add validation, animations, and useful feedback.
                - NEVER output markdown code blocks. Just the raw HTML/JS code.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const data = await response.json();
                let result = data.candidates[0].content.parts[0].text;
                
                // Cleanup markdown wrappers if AI provides them despite instructions
                result = result.replace(/^```html\n?/, '').replace(/\n?```$/, '').trim();

                // Build the FULL standalone document
                const fullDocument = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body>
    ${result}
</body>
</html>`;

                // Store full code for export
                frame.setAttribute('data-full-code', fullDocument);
                // Inject into preview
                frame.srcdoc = fullDocument;
                
                empty.classList.add('opacity-0');
                setTimeout(() => {
                    wrapper.classList.remove('opacity-0', 'scale-95');
                    wrapper.classList.add('opacity-100', 'scale-100');
                }, 200);

                btnText.innerText = "Manifested!";
                setTimeout(() => {
                    btnText.innerText = "Manifest Reality";
                    btn.disabled = false;
                }, 2000);

            } catch (err) {
                console.error(err);
                btnText.innerText = "Error - Try Again";
                btn.disabled = false;
            } finally {
                loader.classList.add('hidden');
                arrow.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
