<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOSITE V2 - Instant Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap');
        
        body { 
            background: #0f111a; 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .glass-sidebar {
            background: #1e2230;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-area {
            background: #252a3d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .input-area:focus-within {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .btn-magic {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-magic:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .preview-pane {
            background: #0a0b10;
        }

        .phone-mockup {
            width: 320px;
            height: 600px;
            background: #ffffff;
            border-radius: 40px;
            border: 8px solid #1a1d26;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3f445e; border-radius: 10px; }
        
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #7c3aed;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex">

    <!-- Main Sidebar -->
    <aside class="glass-sidebar w-[400px] flex flex-col p-8 shrink-0 relative">
        <div class="flex items-center justify-between mb-12">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg text-xl">A</div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-none">AUTOSITE <span class="text-indigo-500">V2</span></h1>
                    <span class="text-[10px] text-slate-500 font-medium uppercase tracking-widest">Pure Logic Injection</span>
                </div>
            </div>
        </div>

        <div class="flex-1 space-y-6">
            <div>
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-3 block">Application Logic</label>
                <div class="input-area rounded-2xl p-4">
                    <textarea id="prompt" placeholder="Describe the functionality. Example: 'A calculator that swears at you' or 'A habit tracker with streaks'..." 
                        class="w-full h-64 bg-transparent text-sm text-slate-200 outline-none resize-none placeholder:text-slate-600"></textarea>
                </div>
            </div>

            <button onclick="generateApp()" id="btn" class="btn-magic w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all active:scale-95">
                <span id="btnText">Generate Magic</span>
                <div id="loader" class="loader"></div>
                <svg id="spark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>

            <div id="status" class="hidden text-center py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                ✨ App injected successfully!
            </div>
        </div>

        <div class="mt-8">
            <button onclick="copySource()" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-slate-400 font-semibold text-sm hover:bg-white/10 transition-all">
                Copy Generated Source
            </button>
            <p class="text-[10px] text-slate-600 mt-4 text-center italic">
                No rules. Just fast, working code.
            </p>
        </div>
    </aside>

    <!-- Preview Canvas -->
    <main class="preview-pane flex-1 flex items-center justify-center relative">
        <div class="phone-mockup">
            <iframe id="preview-frame" class="w-full h-full border-none" 
                srcdoc="<body style='background:#f9fafb;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;color:#94a3b8;padding:20px;text-align:center;'><div><svg style='width:48px;height:48px;margin-bottom:16px;opacity:0.2;' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='1' d='M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z'></path></svg><h2 style='margin:0;font-size:18px;color:#475569;'>Awaiting Logic</h2><p style='font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-top:8px;'>Build something epic.</p></div></body>"></iframe>
        </div>
        
        <div class="absolute bottom-10 text-[10px] text-slate-700 tracking-[0.4em] uppercase font-bold">
            Live Production View
        </div>
    </main>

    <script>
        const apiKey = ""; // Injected by the environment

        function copySource() {
            const code = document.getElementById('preview-frame').srcdoc;
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
        }

        async function generateApp() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return;

            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const spark = document.getElementById('spark');
            const status = document.getElementById('status');
            const frame = document.getElementById('preview-frame');

            btnText.innerText = "Injecting Logic...";
            loader.style.display = "block";
            spark.style.display = "none";
            status.classList.add('hidden');

            const systemPrompt = "You are a senior full-stack developer. Build a single-file HTML/CSS/JS web app based on the prompt. Use Tailwind CSS via CDN. Ensure the logic is robust, professional, and fits within a mobile viewport (max-width: 400px). Provide ONLY the code. No markdown formatting. If the user asks for a specific feature, make sure it actually functions (e.g. calculator must calculate).";

            const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response;
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                    throw err;
                }
            };

            try {
                const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const data = await response.json();
                let code = data.candidates[0].content.parts[0].text;
                
                // Clean markdown wrappers if AI adds them
                code = code.replace(/^```html\n/, '').replace(/\n```$/, '').replace(/^```/, '');

                // Inject into iframe
                frame.srcdoc = code;

                status.classList.remove('hidden');
                btnText.innerText = "Injected!";
                setTimeout(() => {
                    status.classList.add('hidden');
                    btnText.innerText = "Generate Magic";
                }, 3000);

            } catch (e) {
                console.error(e);
                btnText.innerText = "Error";
                status.innerText = "⚠️ Failed to reach the brain. Try again.";
                status.classList.remove('hidden');
                status.classList.replace('bg-emerald-500/10', 'bg-red-500/10');
                status.classList.replace('text-emerald-400', 'text-red-400');
            } finally {
                loader.style.display = "none";
                spark.style.display = "block";
            }
        }
    </script>
</body>
</html>
