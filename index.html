<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Logic - GitHub Integrated</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        body { 
            background: #05060b; 
            color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .neo-sidebar {
            background: rgba(13, 15, 23, 0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            width: 440px;
        }

        .input-group {
            background: #0d0f17;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.2s;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        input, textarea {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn-forge {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-forge:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .device-frame {
            width: 100%;
            max-width: 1000px;
            height: 85%;
            background: #fff;
            border-radius: 20px;
            border: 8px solid #1e2230;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex">

    <aside class="neo-sidebar flex flex-col p-6 shrink-0 relative z-10 overflow-y-auto">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">FORGE <span class="text-indigo-400">GH</span></h1>
        </div>

        <div class="space-y-6">
            <!-- GitHub Settings -->
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">GitHub Configuration</label>
                <div class="space-y-3">
                    <div class="input-group">
                        <input type="text" id="ghRepo" placeholder="username/repo_name" class="placeholder:text-slate-700">
                    </div>
                    <div class="input-group">
                        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (ghp_...)" class="placeholder:text-slate-700">
                    </div>
                </div>
            </div>

            <!-- Prompt -->
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Application Logic</label>
                <div class="input-group">
                    <textarea id="prompt" rows="8" placeholder="Describe your app... (e.g. 'A sleek dashboard for crypto prices with real-time updates')" class="placeholder:text-slate-700 resize-none"></textarea>
                </div>
            </div>

            <button onclick="forgeAndPush()" id="forgeBtn" class="btn-forge w-full py-4 rounded-xl font-bold text-white flex items-center justify-center gap-3 transition-all disabled:opacity-50">
                <span id="btnText">Generate & Push to GitHub</span>
                <div id="loader" class="loader hidden"></div>
            </button>
            
            <div id="statusMsg" class="text-xs text-center font-medium min-h-[1rem]"></div>
        </div>

        <div class="mt-auto pt-6 border-t border-white/5">
            <button onclick="downloadBackup()" class="w-full py-2 text-xs text-slate-400 hover:text-white transition-colors">Download Local Backup Instead</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-8 bg-[#08090f]">
        <div id="frameWrapper" class="device-frame opacity-0 scale-95 transition-all duration-500">
            <iframe id="preview" class="w-full h-full border-none"></iframe>
        </div>
        <div id="emptyState" class="text-center">
            <h2 class="text-2xl font-bold text-slate-700">Ready to Forge</h2>
            <p class="text-slate-500 text-sm mt-2">Enter your GitHub details and prompt to start.</p>
        </div>
    </main>

    <script>
        const apiKey = ""; // Provided by environment

        async function forgeAndPush() {
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('forgeBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            if (!prompt) return showStatus("Please enter a prompt", "text-red-400");
            
            btn.disabled = true;
            btnText.innerText = "Generating...";
            loader.classList.remove('hidden');
            showStatus("Consulting AI Engine...", "text-indigo-400");

            try {
                // 1. Generate Content
                const aiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "Return only valid HTML/CSS/JS code for a single file application. Use Tailwind. No markdown backticks." }] }
                    })
                });

                const aiData = await aiResponse.json();
                let code = aiData.candidates[0].content.parts[0].text;
                code = code.replace(/^```html\n?/, '').replace(/\n?```$/, '').trim();

                const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"><\/script></head><body>${code}</body></html>`;

                // 2. Update Preview
                const preview = document.getElementById('preview');
                preview.srcdoc = fullHtml;
                preview.setAttribute('data-last-code', fullHtml);
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('frameWrapper').classList.remove('opacity-0', 'scale-95');

                // 3. GitHub Push (If details provided)
                if (repo && token) {
                    showStatus("Pushing to GitHub...", "text-yellow-400");
                    await pushToGitHub(repo, token, fullHtml);
                    showStatus("Success! Live on GitHub.", "text-green-400");
                } else {
                    showStatus("Generated locally (GitHub skipped)", "text-slate-400");
                }

            } catch (err) {
                console.error(err);
                showStatus("Error: " + err.message, "text-red-400");
            } finally {
                btn.disabled = false;
                btnText.innerText = "Generate & Push to GitHub";
                loader.classList.add('hidden');
            }
        }

        async function pushToGitHub(repo, token, content) {
            const path = 'index.html';
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            
            // Get existing file SHA if it exists (to update)
            let sha = null;
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }
            } catch (e) {}

            const body = {
                message: "Update from Forge Logic Engine",
                content: btoa(unescape(encodeURIComponent(content))),
                sha: sha
            };

            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!putRes.ok) {
                const errData = await putRes.json();
                throw new Error(errData.message || "GitHub Upload Failed");
            }
        }

        function showStatus(msg, colorClass) {
            const status = document.getElementById('statusMsg');
            status.innerText = msg;
            status.className = `text-xs text-center font-medium mt-2 ${colorClass}`;
        }

        function downloadBackup() {
            const code = document.getElementById('preview').getAttribute('data-last-code');
            if (!code) return;
            const blob = new Blob([code], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }
    </script>
</body>
</html>
